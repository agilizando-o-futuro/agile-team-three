<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <main class="calculator">
            <div class="display">
                <div class="previous-operand" id="previous-operand"></div>
                <div class="current-operand" id="current-operand">0</div>
            </div>
            <div class="buttons-grid">
                <button class="btn btn-action" id="btn-c">C</button>
                <button class="btn btn-action" id="btn-ce">CE</button>
                <button class="btn btn-action span-two" id="btn-explain">✨ Explicar IA</button>
                
                <button class="btn" data-number="7">7</button>
                <button class="btn" data-number="8">8</button>
                <button class="btn" data-number="9">9</button>
                <button class="btn btn-operator" data-operation="÷">÷</button>

                <button class="btn" data-number="4">4</button>
                <button class="btn" data-number="5">5</button>
                <button class="btn" data-number="6">6</button>
                <button class="btn btn-operator" data-operation="*">×</button>

                <button class="btn" data-number="1">1</button>
                <button class="btn" data-number="2">2</button>
                <button class="btn" data-number="3">3</button>
                <button class="btn btn-operator" data-operation="-">-</button>

                <button class="btn" data-number="0">0</button>
                <button class="btn" data-number=".">.</button>
                <button class="btn btn-equal" id="btn-equal">=</button>
                <button class="btn btn-operator" data-operation="+">+</button> 
            </div>
        </main>
        
        <aside class="side-panel">
            <section class="history-section">
                <h2>Histórico</h2>
                <ul id="history-list"></ul>
            </section>
            <section class="explanation-section">
                <h2>Explicação IA</h2>
                <div id="explanation-content" class="explanation-content">
                    Realize um cálculo e clique em "Explicar IA" para ver o passo a passo.
                </div>
            </section>
        </aside>
    </div>
    <script src="script.js"></script>
</body>
</html>
